name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  ci:
    uses: netresearch/typo3-ci-workflows/.github/workflows/ci.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.2","8.3","8.4","8.5"]'
      typo3-versions: '["^13.4","^14.3"]'
      # Repo has no php-cs-fixer / phpstan / rector setup — disable those jobs.
      run-cgl: false
      run-phpstan: false
      run-rector: false
      # No ci:test:php:unit composer script; phpunit.xml.dist lives at repo root.
      unit-test-command: 'vendor/bin/phpunit'
      # This extension has no functional tests. Without this the shared
      # workflow runs its functional job, finds no test script, and reports
      # success — coverage that does not exist. See
      # netresearch/typo3-ci-workflows#188.
      run-functional-tests: false
