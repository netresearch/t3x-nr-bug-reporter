name: Release

on:
  push:
    tags:
      - 'v*'
  # Retry a release whose publication target failed, without deleting and
  # re-cutting the tag: `gh workflow run release.yml --ref vX.Y.Z`. The
  # reusable leaves a published GitHub release as it is, runs the targets
  # again and rewrites the "Publication status" section of the release body.
  workflow_dispatch:

permissions: {}

jobs:
  release:
    uses: netresearch/typo3-ci-workflows/.github/workflows/release-typo3-extension.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      archive-prefix: 'nr-bug-reporter'
      package-name: 'netresearch/nr-bug-reporter'
      extension-key: 'nr_bug_reporter'
      # tailor packages the working directory and ignores .gitattributes, so
      # this list is what keeps agent notes, the dev harness and its fixtures
      # out of the TER zip.
      exclude-from-packaging: 'Build/ExcludeFromPackaging.php'
      # No Documentation/ directory yet, so docs.typo3.org has nothing to render.
      skip-docs: true
    secrets:
      TYPO3_TER_ACCESS_TOKEN: ${{ secrets.TYPO3_TER_ACCESS_TOKEN }}
