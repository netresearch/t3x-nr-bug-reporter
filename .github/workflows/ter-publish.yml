name: Publish to TER (manual)

# Uploads the version that ext_emconf.php declares on the dispatched ref to
# TER, without a new tag. Used to publish a version whose release ran with TER
# switched off, and to retry a failed TER upload. Skips the upload when TER
# already has that version.

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish-to-ter:
    uses: netresearch/typo3-ci-workflows/.github/workflows/publish-to-ter.yml@main
    permissions:
      contents: read
    with:
      exclude-from-packaging: 'Build/ExcludeFromPackaging.php'
    secrets:
      TYPO3_TER_ACCESS_TOKEN: ${{ secrets.TYPO3_TER_ACCESS_TOKEN }}
