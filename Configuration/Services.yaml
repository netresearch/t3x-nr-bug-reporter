services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Netresearch\NrBugReporter\:
    resource: '../Classes/*'

  # The exception handlers are instantiated by core via GeneralUtility::makeInstance() (no DI),
  # so they must not be wired as container services.
  Netresearch\NrBugReporter\Error\ReportingExceptionHandler:
    autowire: false
    autoconfigure: false

  Netresearch\NrBugReporter\Error\ReportingProductionExceptionHandler:
    autowire: false
    autoconfigure: false
